[pytest]
# Ensures config.py, engine.py, etc. (at the project root) are importable
# from tests/, regardless of whether pytest is invoked as `pytest`,
# `python -m pytest`, or from a different working directory. Without
# this, `pytest tests/` fails with "ModuleNotFoundError: No module named
# 'config'" because pytest's default import mode only adds the tests/
# directory itself to sys.path, not the project root.
pythonpath = .
